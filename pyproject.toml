[project]
name = "mq-adapter"
version = "0.1.0"
description = ""
authors = [
    {name = "Artur",email = "a.novikov@medsyst.ru"}
]
readme = "README.md"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[[tool.poetry.source]]
name = "bx-client"
url = "https://gitlab.medsyst.tech/api/v4/projects/5/packages/pypi/simple"
priority = "supplemental"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
aio-pika = ">=9.5.8,<10.0.0"
pydantic = ">=2.12.4,<3.0.0"
pydantic-settings = ">=2.12.0,<3.0.0"
bx-client = { version = "^0.4.8", source = "bx-client" }
redis = "^7.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend-ignore = [ "F821",]
line-length = 120

[tool.black]
line-length = 120

[tool.poetry.dev-dependencies]
black = "^25.1.0"
ruff = ">=0.12.1,<0.13.0"
pre-commit = "^4.2.0"
pytest = ">=9.0.1,<10.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
toml = "^0.10.2"
